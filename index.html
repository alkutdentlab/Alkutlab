<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الكوت لصناعة الأسنان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --teal: #27ABB0;
            --gold: #D6A537;
            --bg: #F8FAFC;
            --text: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px 15px;
        }

        .card {
            background: #FFFFFF;
            max-width: 480px;
            width: 100%;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo {
            width: 170px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--gold);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--teal);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .description {
            font-size: 0.9rem;
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 35px;
        }

        .feature-item {
            background: #F1F5F9;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: 600;
        }

        .feature-item i {
            color: var(--teal);
            margin-left: 5px;
        }

        .links-title {
            font-size: 0.9rem;
            color: #94A3B8;
            margin-bottom: 15px;
            position: relative;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .whatsapp { background-color: #25D366; }
        .instagram { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .facebook { background-color: #1877F2; }

        .btn-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #CBD5E1;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الشعار -->
        <img src="logo.png" alt="مختبر الكوت لصناعة الأسنان" class="logo">
        
        <!-- العناوين -->
        <h1>مختبر الكوت</h1>
        <div class="subtitle">لصناعة الأسنان الرقمية</div>
        
        <p class="description">
            نحول خطط طبيب الأسنان إلى تركيبات سنية دقيقة باستخدام أحدث التقنيات الرقمية والمواد العالمية.
        </p>

        <!-- ميزات سريعة مرتبة -->
        <div class="features">
            <div class="feature-item"><i class="fas fa-microscope"></i> دقة عالية</div>
            <div class="feature-item"><i class="fas fa-bolt"></i> سرعة إنجاز</div>
            <div class="feature-item"><i class="fas fa-tooth"></i> مظهر طبيعي</div>
            <div class="feature-item"><i class="fas fa-shield-alt"></i> متانة وجودة</div>
        </div>

        <!-- أزرار التواصل -->
        <div class="links-title">تواصل معنا مباشرة</div>
        <div class="btn-list">
            <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn whatsapp" target="_blank">
                <div class="btn-text">
                    <i class="fab fa-whatsapp fa-lg"></i>
                    <span>واتساب</span>
                </div>
                <i class="fas fa-chevron-left"></i>
            </a>

            <a href="YOUR_INSTAGRAM_LINK" class="btn instagram" target="_blank">
                <div class="btn-text">
                    <i class="fab fa-instagram fa-lg"></i>
                    <span>إنستغرام</span>
                </div>
                <i class="fas fa-chevron-left"></i>
            </a>

            <a href="YOUR_FACEBOOK_LINK" class="btn facebook" target="_blank">
                <div class="btn-text">
                    <i class="fab fa-facebook-f fa-lg"></i>
                    <span>فيسبوك</span>
                </div>
                <i class="fas fa-chevron-left"></i>
            </a>
        </div>

        <footer>
            © مختبر الكوت لصناعة الأسنان
        </footer>
    </div>

</body>
</html>
