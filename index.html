<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الكوت لصناعة الأسنان</title>
    <style>
        :root {
            /* الألوان الدقيقة من الشعار */
            --teal-color: #27ABB0; /* الأزرق السماوي */
            --gold-color: #D6A537; /* الذهبي */
            --dark-text: #1f2937;
            --white-bg: #FFFFFF;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--white-bg); /* خلفية بيضاء نقية */
            color: var(--dark-text);
            text-align: center;
        }
        
        header {
            background-color: #ffffff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); /* ظل ناعم */
        }
        
        .logo {
            max-width: 250px; /* تم تكبيره قليلاً ليتناسب مع التفاصيل */
            height: auto;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        h1 { 
            color: var(--gold-color); /* الذهبي للعنوان الرئيسي */
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: bold;
        }
        
        p {
            color: var(--teal-color); /* الأزرق السماوي للوصف */
            font-size: 1.2rem;
            line-height: 1.8;
            margin-top: 0;
        }
        
        .divider {
            height: 2px;
            background: linear-gradient(to right, #ffffff, var(--gold-color), #ffffff);
            margin: 30px auto;
            width: 80%;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 50px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 25px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        /* تنسيق أزرار التواصل الاجتماعي بألوانها الرسمية لسهولة التعرف عليها */
        .whatsapp { background-color: #25D366; }
        .facebook { background-color: #1877F2; }
        .instagram { background-color: #E4405F; }

        /* تلميح صغير للأناقة: جعل الحواشي بالألوان الخاصة */
        .instagram {
             background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

    </style>
</head>
<body>

    <header>
        <!-- تأكد أن ملف الشعار مسمّى logo.png -->
        <img src="logo.png" alt="شعار مختبر الكوت لصناعة الأسنان" class="logo">
    </header>

    <div class="container">
        <h1>مختبر الكوت لصناعة الأسنان</h1>
        <p>دقة متناهية. تقنيات رقمية حديثة. التزام بابتسامة مثالية.</p>
        
        <div class="divider"></div>

        <div class="btn-container">
            <!-- استبدل YOUR_PHONE_NUMBER و YOUR_LINKS -->
            <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn whatsapp" target="_blank">تواصل معنا عبر واتساب</a>
            <a href="YOUR_FACEBOOK_LINK" class="btn facebook" target="_blank">صفحتنا على فيسبوك</a>
            <a href="YOUR_INSTAGRAM_LINK" class="btn instagram" target="_blank">حسابنا على إنستغرام</a>
        </div>
    </div>

</body>
</html>
